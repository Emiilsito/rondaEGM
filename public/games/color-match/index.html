<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Color Match</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: 72px 16px 20px; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#prompt { text-align: center; font-size: 1.4rem; font-weight: 700; }
#grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 340px; width: 100%; margin: 0 auto; align-content: center; }
.cell { aspect-ratio: 1; border-radius: 16px; cursor: pointer; transition: transform .1s ease, box-shadow .15s ease; border: 3px solid transparent; }
.cell:active { transform: scale(0.95); }
.cell.correct { border-color: #C8F542; box-shadow: 0 0 20px rgba(200,245,66,.4); }
.cell.wrong { border-color: #ff5c3a; }
#scoreline { text-align: center; font-size: 1.1rem; font-weight: 700; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">20 rondas · encuentra el color diferente</span></div></div>
<div id="root">
  <div id="prompt">Encuentra el color diferente</div>
  <div id="grid"></div>
  <div id="scoreline">0 pts</div>
</div>
<script>
const GAME_ID = "color-match";
const ROUNDS = 20;
const COLORS = ["#ff5c3a", "#4a9eff", "#C8F542", "#ff8f73", "#a78bfa", "#5eead4", "#fda4af", "#fde68a"];
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let round = 0, score = 0, targetIndex = 0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function makeRound(){
  round++;
  if (round > ROUNDS) return finish();
  const base = COLORS[Math.floor(rnd() * COLORS.length)];
  const diff = COLORS[Math.floor(rnd() * COLORS.length)];
  targetIndex = Math.floor(rnd() * 9);
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const diffAmount = 15 + Math.floor(rnd() * 20);
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement("button");
    cell.type = "button";
    cell.style.background = i === targetIndex ? diff : base;
    cell.addEventListener("click", () => answer(i === targetIndex, cell));
    grid.appendChild(cell);
  }
  document.getElementById("scoreline").textContent = score + " pts";
}

function answer(correct, cell){
  if (!started || finished) return;
  if (correct) {
    score += 1;
    cell.classList.add("correct");
    post({type:"score", score});
  } else {
    cell.classList.add("wrong");
    post({type:"score", score});
  }
  setTimeout(makeRound, 200);
}

function finish(){
  if (finished) return;
  finished = true;
  post({type:"finished", score});
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  post({type:"started"});
  post({type:"score", score:0});
  makeRound();
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
