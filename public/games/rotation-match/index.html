<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Rotation Match</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: 72px 16px 20px; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#prompt { text-align: center; font-size: 1.2rem; font-weight: 700; }
#shape-container { display: grid; place-items: center; }
#shape { font-size: 5rem; transition: transform .3s ease; cursor: pointer; }
#scoreline { text-align: center; font-size: 1.1rem; font-weight: 700; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">15 rondas · toca cuando apunte arriba</span></div></div>
<div id="root">
  <div id="prompt">Toca cuando apunte ↑</div>
  <div id="shape-container"><div id="shape">↑</div></div>
  <div id="scoreline">0 pts</div>
</div>
<script>
const GAME_ID = "rotation-match";
const ROUNDS = 15;
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let round = 0, score = 0, rotation = 0, spinning = false;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}

function spin(){
  if (spinning) return;
  spinning = true;
  const target = Math.floor(rnd() * 8) * 45;
  rotation += 720 + target;
  document.getElementById("shape").style.transform = "rotate(" + rotation + "deg)";
  setTimeout(() => {
    spinning = false;
    const finalAngle = rotation % 360;
    if (finalAngle === 0) {
      score += 1;
      post({type:"score", score});
    }
    document.getElementById("scoreline").textContent = score + " pts";
    round++;
    if (round >= ROUNDS) return finish();
    setTimeout(spin, 500 + rnd() * 1000);
  }, 1500);
}

function tap(){
  if (!started || finished || spinning) return;
  const finalAngle = rotation % 360;
  if (finalAngle === 0) {
    score += 1;
    post({type:"score", score});
    spinning = true;
    setTimeout(() => {
      spinning = false;
      round++;
      if (round >= ROUNDS) return finish();
      spin();
    }, 300);
  }
}

function finish(){
  if (finished) return;
  finished = true;
  post({type:"finished", score});
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  post({type:"started"});
  post({type:"score", score:0});
  setTimeout(spin, 1000);
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
document.getElementById("shape").addEventListener("click", tap);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
