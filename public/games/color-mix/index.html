<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Color Mix</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: 72px 16px 20px; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#target { text-align: center; font-size: 1.2rem; font-weight: 700; }
#target-color { width: 100px; height: 100px; border-radius: 20px; margin: 10px auto; }
#sliders { display: flex; flex-direction: column; gap: 12px; max-width: 300px; width: 100%; margin: 0 auto; }
.slider { display: flex; align-items: center; gap: 10px; }
.slider label { width: 20px; font-weight: 700; }
.slider input { flex: 1; }
#scoreline { text-align: center; font-size: 1.1rem; font-weight: 700; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">10 rondas · mezcla el color correcto</span></div></div>
<div id="root">
  <div id="target">Crea este color:</div>
  <div id="target-color"></div>
  <div id="sliders">
    <div class="slider"><label>R</label><input type="range" id="r" min="0" max="255" /></div>
    <div class="slider"><label>G</label><input type="range" id="g" min="0" max="255" /></div>
    <div class="slider"><label>B</label><input type="range" id="b" min="0" max="255" /></div>
  </div>
  <div id="scoreline">0 pts</div>
</div>
<script>
const GAME_ID = "color-mix";
const ROUNDS = 10;
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let round = 0, score = 0, targetR = 0, targetG = 0, targetB = 0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}

function makeRound(){
  round++;
  if (round > ROUNDS) return finish();
  targetR = Math.floor(rnd() * 256);
  targetG = Math.floor(rnd() * 256);
  targetB = Math.floor(rnd() * 256);
  document.getElementById("target-color").style.background = "rgb(" + targetR + "," + targetG + "," + targetB + ")";
  document.getElementById("r").value = Math.floor(rnd() * 256);
  document.getElementById("g").value = Math.floor(rnd() * 256);
  document.getElementById("b").value = Math.floor(rnd() * 256);
  document.getElementById("scoreline").textContent = score + " pts";
}

function submit(){
  if (!started || finished) return;
  const r = Number(document.getElementById("r").value);
  const g = Number(document.getElementById("g").value);
  const b = Number(document.getElementById("b").value);
  const diff = Math.abs(r - targetR) + Math.abs(g - targetG) + Math.abs(b - targetB);
  const maxDiff = 765;
  const points = Math.max(0, Math.round((1 - diff / maxDiff) * 10));
  score += points;
  post({type:"score", score});
  document.getElementById("scoreline").textContent = score + " pts";
  makeRound();
}

function finish(){
  if (finished) return;
  finished = true;
  post({type:"finished", score});
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  post({type:"started"});
  post({type:"score", score:0});
  makeRound();
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
