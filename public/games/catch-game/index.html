<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Catch Game</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; position: relative; overflow: hidden; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#timer { position: absolute; top: 20px; left: 0; right: 0; text-align: center; color: #C8F542; font-weight: 700; font-size: 1.1rem; z-index: 2; }
#scoreline { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 1.1rem; font-weight: 700; z-index: 2; }
.basket { position: absolute; bottom: 40px; width: 80px; height: 40px; background: #4a9eff; border-radius: 0 0 40px 40px; transition: left .05s linear; }
.falling { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: #ff5c3a; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">15 segundos · atrapa los objetos</span></div></div>
<div id="root">
  <div id="timer">15s</div>
  <div class="basket" id="basket"></div>
  <div id="scoreline">0 pts</div>
</div>
<script>
const GAME_ID = "catch-game";
const DURATION = 15;
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let score = 0, endsAt = 0, basketX = 50, fallingItems = [];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}

function spawn(){
  if (finished) return;
  const item = document.createElement("div");
  item.className = "falling";
  item.style.left = (10 + rnd() * 80) + "%";
  item.style.top = "0";
  document.getElementById("root").appendChild(item);
  fallingItems.push({ el: item, y: 0, speed: 3 + rnd() * 4 });
  setTimeout(spawn, 400 + rnd() * 600);
}

function moveBasket(e){
  if (!started || finished) return;
  const touch = e.touches ? e.touches[0] : e;
  const rect = document.getElementById("root").getBoundingClientRect();
  basketX = ((touch.clientX - rect.left) / rect.width) * 100;
  document.getElementById("basket").style.left = "calc(" + basketX + "% - 40px)";
}

function tick(){
  if (!started || finished) return;
  const left = Math.max(0, Math.ceil((endsAt - performance.now()) / 1000));
  document.getElementById("timer").textContent = left + "s";
  if (left <= 0) {
    finished = true;
    post({type:"finished", score});
    return;
  }
  const root = document.getElementById("root");
  const basket = document.getElementById("basket");
  const basketRect = basket.getBoundingClientRect();
  for (let i = fallingItems.length - 1; i >= 0; i--) {
    const item = fallingItems[i];
    item.y += item.speed;
    item.el.style.top = item.y + "px";
    const itemRect = item.el.getBoundingClientRect();
    if (itemRect.bottom > basketRect.top && itemRect.top < basketRect.bottom &&
        itemRect.left < basketRect.right && itemRect.right > basketRect.left) {
      item.el.remove();
      fallingItems.splice(i, 1);
      score += 1;
      document.getElementById("scoreline").textContent = score + " pts";
      post({type:"score", score});
    } else if (item.y > window.innerHeight) {
      item.el.remove();
      fallingItems.splice(i, 1);
    }
  }
  requestAnimationFrame(tick);
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  endsAt = performance.now() + DURATION * 1000;
  post({type:"started"});
  post({type:"score", score:0});
  spawn();
  requestAnimationFrame(tick);
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
document.getElementById("root").addEventListener("touchmove", moveBasket);
document.getElementById("root").addEventListener("mousemove", moveBasket);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
