<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Reaction Test</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; display: grid; place-items: center; position: relative; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#area { width: 100%; height: 100%; display: grid; place-items: center; cursor: pointer; }
#circle { width: 180px; height: 180px; border-radius: 50%; display: grid; place-items: center; font-size: 1.2rem; font-weight: 700; transition: background .15s ease; }
#circle.wait { background: #ff5c3a; }
#circle.ready { background: #C8F542; color: #071018; }
#circle.too-soon { background: #ff5c3a; }
#circle.show { background: #C8F542; color: #071018; }
#hud { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 1.1rem; font-weight: 700; }
</style>
</head>
<body>
<div id="root">
  <div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">5 rondas · reacciona rápido</span></div></div>
  <div id="area"><div id="circle" class="wait">...</div></div>
  <div id="hud"></div>
</div>
<script>
const GAME_ID = "reaction-test";
const ROUNDS = 5;
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let round = 0, times = [], startTime = 0, state = "wait", timeout = 0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function setHud(t){document.getElementById("hud").textContent=t}

async function playRound(){
  round++;
  if (round > ROUNDS) return finish();
  const circle = document.getElementById("circle");
  circle.className = "wait";
  circle.textContent = "...";
  setHud("Ronda " + round + "/" + ROUNDS);
  await sleep(1000 + rnd() * 2000);
  circle.className = "show";
  circle.textContent = "¡YA!";
  startTime = performance.now();
  state = "ready";
  post({type:"score", score: 0});
}

function tap(){
  if (!started || finished) return;
  if (state === "wait") {
    clearTimeout(timeout);
    document.getElementById("circle").className = "too-soon";
    document.getElementById("circle").textContent = "¡Pronto!";
    setHud("Muy pronto...");
    setTimeout(playRound, 800);
  } else if (state === "ready") {
    const elapsed = (performance.now() - startTime) / 1000;
    times.push(elapsed);
    document.getElementById("circle").className = "show";
    document.getElementById("circle").textContent = Math.round(elapsed * 1000) + "ms";
    setHud("Ronda " + round + "/" + ROUNDS);
    state = "wait";
    post({type:"score", score: -elapsed});
    setTimeout(playRound, 600);
  }
}

function finish(){
  if (finished) return;
  finished = true;
  const avg = times.reduce((a,b) => a+b, 0) / times.length;
  setHud("Promedio: " + Math.round(avg * 1000) + "ms");
  post({type:"finished", score: -avg});
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  post({type:"started"});
  playRound();
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
document.getElementById("area").addEventListener("click", tap);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
