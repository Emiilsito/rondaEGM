<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Word Scramble</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; gap: 14px; padding: 72px 16px 20px; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#timer { text-align: center; color: #C8F542; font-weight: 700; font-size: 1.1rem; }
#scrambled { text-align: center; font-size: 2.5rem; font-weight: 800; letter-spacing: .1em; }
#input { display: flex; gap: 8px; justify-content: center; }
#input input { width: 200px; padding: 12px; border-radius: 12px; border: 0; background: rgba(255,255,255,.1); color: #fff; font-size: 1.2rem; font-weight: 700; text-align: center; }
#scoreline { text-align: center; font-size: 1.1rem; font-weight: 700; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">30 segundos · descifra las palabras</span></div></div>
<div id="root">
  <div id="timer">30s</div>
  <div id="scrambled">...</div>
  <div id="input"><input type="text" id="answer" placeholder="Tu respuesta" autocomplete="off" /></div>
  <div id="scoreline">0 pts</div>
</div>
<script>
const GAME_ID = "word-scramble";
const DURATION = 30;
const WORDS = ["GATO", "PERRO", "CASA", "ARBOL", "NUBE", "LIBRO", "AMIGO", "FIESTA", "MUSICA", "DEPORTE"];
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let score = 0, endsAt = 0, currentWord = "";

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}
function shuffle(str){return str.split("").sort(() => rnd() - 0.5).join("")}

function newWord(){
  currentWord = WORDS[Math.floor(rnd() * WORDS.length)];
  let scrambled = shuffle(currentWord);
  while (scrambled === currentWord) scrambled = shuffle(currentWord);
  document.getElementById("scrambled").textContent = scrambled;
  document.getElementById("answer").value = "";
}

function check(){
  if (!started || finished) return;
  const answer = document.getElementById("answer").value.toUpperCase().trim();
  if (answer === currentWord) {
    score += currentWord.length;
    post({type:"score", score});
    document.getElementById("scoreline").textContent = score + " pts";
    newWord();
  }
}

function tick(){
  if (!started || finished) return;
  const left = Math.max(0, Math.ceil((endsAt - performance.now()) / 1000));
  document.getElementById("timer").textContent = left + "s";
  if (left <= 0) {
    finished = true;
    post({type:"finished", score});
    return;
  }
  requestAnimationFrame(tick);
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  endsAt = performance.now() + DURATION * 1000;
  post({type:"started"});
  post({type:"score", score:0});
  newWord();
  requestAnimationFrame(tick);
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
document.getElementById("answer").addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
