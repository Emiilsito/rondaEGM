<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Ball Bounce</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; position: relative; overflow: hidden; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#timer { position: absolute; top: 20px; left: 0; right: 0; text-align: center; color: #C8F542; font-weight: 700; font-size: 1.1rem; z-index: 2; }
#scoreline { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 1.1rem; font-weight: 700; z-index: 2; }
.ball { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ff8f73, #ff5c3a); }
.paddle { position: absolute; bottom: 30px; width: 100px; height: 16px; background: #4a9eff; border-radius: 8px; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">20 segundos · rebota la pelota</span></div></div>
<div id="root">
  <div id="timer">20s</div>
  <div class="paddle" id="paddle"></div>
  <div id="scoreline">0 rebotes</div>
</div>
<script>
const GAME_ID = "ball-bounce";
const DURATION = 20;
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let endsAt = 0, paddleX = 50, ballX = 50, ballY = 50, velX = 3, velY = 3, bounces = 0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a,a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}

function spawnBall(){
  const ball = document.createElement("div");
  ball.className = "ball";
  ballX = 30 + rnd() * 40;
  ballY = 20;
  velX = (rnd() > 0.5 ? 1 : -1) * (2 + rnd() * 2);
  velY = 2 + rnd() * 2;
  document.getElementById("root").appendChild(ball);
  return ball;
}

function movePaddle(e){
  if (!started || finished) return;
  const touch = e.touches ? e.touches[0] : e;
  const rect = document.getElementById("root").getBoundingClientRect();
  paddleX = ((touch.clientX - rect.left) / rect.width) * 100;
  document.getElementById("paddle").style.left = "calc(" + paddleX + "% - 50px)";
}

function tick(){
  if (!started || finished) return;
  const left = Math.max(0, Math.ceil((endsAt - performance.now()) / 1000));
  document.getElementById("timer").textContent = left + "s";
  if (left <= 0) {
    finished = true;
    post({type:"finished", score: bounces});
    return;
  }
  const root = document.getElementById("root");
  const ball = root.querySelector(".ball");
  if (!ball) return;
  ballX += velX * 0.5;
  ballY += velY * 0.5;
  if (ballX < 5 || ballX > 95) velX *= -1;
  if (ballY < 5) velY *= -1;
  if (ballY > 85) {
    if (Math.abs(ballX - paddleX) < 12) {
      velY *= -1;
      velX += (rnd() - 0.5) * 2;
      bounces++;
      document.getElementById("scoreline").textContent = bounces + " rebotes";
      post({type:"score", score: bounces});
    } else if (ballY > 100) {
      ballY = 20;
      ballX = 30 + rnd() * 40;
      velX = (rnd() > 0.5 ? 1 : -1) * (2 + rnd() * 2);
      velY = 2 + rnd() * 2;
    }
  }
  ball.style.left = ballX + "%";
  ball.style.top = ballY + "%";
  requestAnimationFrame(tick);
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  endsAt = performance.now() + DURATION * 1000;
  post({type:"started"});
  post({type:"score", score:0});
  spawnBall();
  requestAnimationFrame(tick);
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
document.getElementById("root").addEventListener("touchmove", movePaddle);
document.getElementById("root").addEventListener("mousemove", movePaddle);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
