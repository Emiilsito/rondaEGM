<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Pattern Trace</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; display: grid; place-items: center; position: relative; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cell { width: 80px; height: 80px; border-radius: 16px; background: rgba(255,255,255,.1); cursor: pointer; transition: background .15s ease; }
.cell.lit { background: #4a9eff; }
.cell:active { transform: scale(0.95); }
#hud { position: absolute; bottom: 40px; left: 0; right: 0; text-align: center; font-size: 1.1rem; font-weight: 700; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">5 rondas · repite el patrón</span></div></div>
<div id="root">
  <div id="grid"></div>
  <div id="hud"></div>
</div>
<script>
const GAME_ID = "pattern-trace";
const ROUNDS = 5;
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let round = 0, pattern = [], inputIndex = 0, accepting = false;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function playRound(){
  round++;
  if (round > ROUNDS) return finish();
  pattern.push(Math.floor(rnd() * 9));
  inputIndex = 0;
  accepting = false;
  document.getElementById("hud").textContent = "Ronda " + round + "/" + ROUNDS;
  await sleep(500);
  for (const i of pattern) {
    const cell = document.querySelectorAll(".cell")[i];
    cell.classList.add("lit");
    await sleep(400);
    cell.classList.remove("lit");
    await sleep(150);
  }
  accepting = true;
}

function tap(i){
  if (!accepting || finished) return;
  if (pattern[inputIndex] !== i) {
    finished = true;
    accepting = false;
    document.getElementById("hud").textContent = "Fin · ronda " + round;
    post({type:"finished", score: round});
    return;
  }
  inputIndex++;
  if (inputIndex >= pattern.length) {
    accepting = false;
    document.getElementById("hud").textContent = "¡Bien!";
    setTimeout(playRound, 600);
  }
}

function finish(){
  if (finished) return;
  finished = true;
  post({type:"finished", score: round});
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  post({type:"started"});
  post({type:"score", score: 1});
  playRound();
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
const grid = document.getElementById("grid");
for (let i = 0; i < 9; i++) {
  const cell = document.createElement("button");
  cell.type = "button";
  cell.className = "cell";
  cell.addEventListener("click", () => tap(i));
  grid.appendChild(cell);
}
document.getElementById("hint").addEventListener("click", start);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
