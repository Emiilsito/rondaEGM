<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Quick Sum</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; user-select: none; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
      #root { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; gap: 14px; padding: 72px 16px 20px; }
      #hint {
        position: absolute; inset: 0; display: grid; place-items: center;
        background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px);
      }
      #timer { text-align: center; color: #C8F542; font-weight: 700; font-size: 1.1rem; letter-spacing: .06em; }
      #prompt { text-align: center; font-size: 2.4rem; font-weight: 700; letter-spacing: .02em; margin-top: 8px; }
      #choices { display: grid; gap: 10px; max-width: 340px; width: 100%; margin: 0 auto; align-content: center; }
      .choice {
        border: 0; border-radius: 14px; padding: 16px; font-size: 1.25rem; font-weight: 700;
        background: rgba(255,255,255,.08); color: #fff; cursor: pointer; touch-action: manipulation;
        transition: transform .1s ease, background .15s ease;
      }
      .choice:active { transform: scale(0.98); }
      .choice.good { background: rgba(200,245,66,.25); }
      .choice.bad { background: rgba(255,92,58,.3); }
      #scoreline { text-align: center; opacity: .75; }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .choice.bad { animation: shake .3s ease; }
      @keyframes bounce-good {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      .choice.good { animation: bounce-good .2s ease; }
    </style>
  </head>
  <body>
    <div id="hint"><div style="text-align:center"><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">30 segundos · sumas rápidas</span></div></div>
    <div id="root">
      <div id="timer">30s</div>
      <div id="prompt">3 + 5</div>
      <div id="choices"></div>
      <div id="scoreline">0 pts</div>
    </div>
    <script>
      const GAME_ID = "quick-sum";
      const DURATION = 30;
      let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
      let score = 0, endsAt = 0, correct = 0;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
      function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}
      function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

      function makeQuestion(){
        const a = 2 + Math.floor(rnd()*12);
        const b = 2 + Math.floor(rnd()*12);
        correct = a + b;
        const wrong = new Set();
        while (wrong.size < 3) {
          const delta = (Math.floor(rnd()*5)+1) * (rnd() < .5 ? -1 : 1);
          const w = correct + delta;
          if (w !== correct && w > 0) wrong.add(w);
        }
        const options = shuffle([correct, ...wrong]);
        document.getElementById("prompt").textContent = a + " + " + b;
        const box = document.getElementById("choices");
        box.innerHTML = "";
        options.forEach((n) => {
          const btn = document.createElement("button");
          btn.className = "choice";
          btn.type = "button";
          btn.textContent = String(n);
          btn.addEventListener("click", () => answer(n, btn));
          box.appendChild(btn);
        });
      }

      function answer(n, btn){
        if (!started || finished) return;
        if (n === correct) {
          score += 1;
          btn.classList.add("good");
          document.getElementById("scoreline").textContent = score + " pts";
          post({type:"score", score});
          setTimeout(makeQuestion, 120);
        } else {
          btn.classList.add("bad");
          score = Math.max(0, score - 1);
          document.getElementById("scoreline").textContent = score + " pts";
          post({type:"score", score});
          setTimeout(makeQuestion, 180);
        }
      }

      function tick(){
        if (!started || finished) return;
        const left = Math.max(0, Math.ceil((endsAt - performance.now())/1000));
        document.getElementById("timer").textContent = left + "s";
        if (left <= 0) {
          finished = true;
          post({type:"finished", score});
          return;
        }
        requestAnimationFrame(tick);
      }

      function start(){
        if (started || !hostReady) return;
        started = true;
        document.getElementById("hint").style.display = "none";
        endsAt = performance.now() + DURATION * 1000;
        post({type:"started"});
        post({type:"score", score:0});
        makeQuestion();
        requestAnimationFrame(tick);
      }

      window.addEventListener("message", (e)=>{
        const d=e.data; if(!d||typeof d!=="object") return;
        if(d.type==="hostReady"){
          hostReady=true;
          if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
        }
      });

      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
      rnd = mulberry32(seed);
      document.getElementById("hint").addEventListener("click", start);
      post({type:"ready", version:"1.0.0"});
    </script>
  </body>
</html>
