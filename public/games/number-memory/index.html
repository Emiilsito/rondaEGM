<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Number Memory</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; display: grid; place-items: center; position: relative; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#number { font-size: 4rem; font-weight: 800; letter-spacing: .1em; }
#input { margin-top: 20px; }
#input input { width: 200px; padding: 12px; border-radius: 12px; border: 0; background: rgba(255,255,255,.1); color: #fff; font-size: 1.5rem; font-weight: 700; text-align: center; }
#hud { position: absolute; bottom: 40px; left: 0; right: 0; text-align: center; font-size: 1.1rem; font-weight: 700; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">Memoriza el número y repítelo</span></div></div>
<div id="root">
  <div>
    <div id="number">...</div>
    <div id="input"><input type="text" id="answer" placeholder="Tu respuesta" autocomplete="off" style="display:none" /></div>
  </div>
  <div id="hud"></div>
</div>
<script>
const GAME_ID = "number-memory";
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let level = 1, number = "", showing = true;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function playRound(){
  number = String(Math.floor(rnd() * 10 ** level));
  document.getElementById("number").textContent = number;
  document.getElementById("hud").textContent = "Nivel " + level;
  document.getElementById("answer").style.display = "none";
  await sleep(1000 + level * 500);
  document.getElementById("number").textContent = "?";
  document.getElementById("answer").style.display = "block";
  document.getElementById("answer").value = "";
  document.getElementById("answer").focus();
}

function check(){
  if (!started || finished) return;
  const answer = document.getElementById("answer").value.trim();
  if (answer === number) {
    level += 1;
    post({type:"score", score: level});
    document.getElementById("hud").textContent = "¡Bien!";
    setTimeout(playRound, 800);
  } else {
    finished = true;
    document.getElementById("hud").textContent = "Fin · nivel " + level;
    post({type:"finished", score: level});
  }
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  post({type:"started"});
  post({type:"score", score: 1});
  playRound();
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
document.getElementById("answer").addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
