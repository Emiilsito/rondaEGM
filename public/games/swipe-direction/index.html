<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Swipe Direction</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: 72px 16px 20px; touch-action: none; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#prompt { text-align: center; font-size: 3rem; font-weight: 800; }
#scoreline { text-align: center; font-size: 1.1rem; font-weight: 700; }
@keyframes slide { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#prompt { animation: slide .3s ease; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">15 rondas · desliza en la dirección correcta</span></div></div>
<div id="root">
  <div id="prompt">↑</div>
  <div id="scoreline">0 pts</div>
</div>
<script>
const GAME_ID = "swipe-direction";
const ROUNDS = 15;
const DIRS = ["↑", "↓", "←", "→"];
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let round = 0, score = 0, currentDir = "";

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}

function makeRound(){
  round++;
  if (round > ROUNDS) return finish();
  currentDir = DIRS[Math.floor(rnd() * 4)];
  const prompt = document.getElementById("prompt");
  prompt.textContent = currentDir;
  prompt.style.animation = "none";
  prompt.offsetHeight;
  prompt.style.animation = "slide .3s ease";
}

function swipe(dir){
  if (!started || finished) return;
  if (dir === currentDir) {
    score += 1;
    post({type:"score", score});
  }
  document.getElementById("scoreline").textContent = score + " pts";
  makeRound();
}

function handleSwipe(e){
  if (!started || finished) return;
  const touch = e.touches[0];
  const startX = touch.clientX;
  const startY = touch.clientY;
  const handleMove = (e) => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      swipe(dx > 0 ? "→" : "←");
    } else {
      swipe(dy > 0 ? "↓" : "↑");
    }
    document.removeEventListener("touchmove", handleMove);
  };
  document.addEventListener("touchmove", handleMove, { once: true });
}

function finish(){
  if (finished) return;
  finished = true;
  post({type:"finished", score});
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  post({type:"started"});
  post({type:"score", score:0});
  makeRound();
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
document.getElementById("root").addEventListener("touchstart", handleSwipe);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
