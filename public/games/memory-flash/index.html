<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Memory Flash</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; user-select: none; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
      #root { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 16px; padding: 72px 16px 20px; }
      #hint {
        position: absolute; inset: 0; display: grid; place-items: center;
        background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px);
      }
      #status { text-align: center; opacity: .8; font-size: .95rem; min-height: 1.4em; }
      #pad {
        display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 320px; width: 100%; margin: 0 auto; align-content: center;
      }
      .cell {
        aspect-ratio: 1; border: 0; border-radius: 18px; font-size: 1.4rem; font-weight: 700;
        color: #071018; cursor: pointer; touch-action: manipulation;
        transition: transform .1s ease, filter .15s ease, opacity .15s ease, box-shadow .15s ease;
      }
      .cell:active { transform: scale(0.96); }
      .cell.lit { filter: brightness(1.35); box-shadow: 0 0 0 3px rgba(200,245,66,.55), 0 0 20px rgba(200,245,66,.3); }
      .cell:disabled { opacity: .55; cursor: default; }
      #level { text-align: center; color: #C8F542; font-weight: 600; letter-spacing: .04em; }
      .c0 { background: #5eead4; } .c1 { background: #fda4af; } .c2 { background: #fde68a; } .c3 { background: #a5b4fc; }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      .cell.lit { animation: pulse .3s ease; }
    </style>
  </head>
  <body>
    <div id="hint"><div style="text-align:center"><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">Memoriza y repite la secuencia</span></div></div>
    <div id="root">
      <div id="level">Nivel 1</div>
      <div id="pad">
        <button class="cell c0" data-i="0" type="button"></button>
        <button class="cell c1" data-i="1" type="button"></button>
        <button class="cell c2" data-i="2" type="button"></button>
        <button class="cell c3" data-i="3" type="button"></button>
      </div>
      <div id="status">Observa…</div>
    </div>
    <script>
      const GAME_ID = "memory-flash";
      let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
      let sequence = [], inputIndex = 0, level = 1, accepting = false;

      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
      function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}
      function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
      function setStatus(t){document.getElementById("status").textContent=t}
      function setLevel(n){document.getElementById("level").textContent="Nivel "+n; post({type:"score", score:n})}

      async function flash(i){
        const el = document.querySelector('.cell[data-i="'+i+'"]');
        el.classList.add("lit");
        await sleep(420);
        el.classList.remove("lit");
        await sleep(140);
      }

      async function playSequence(){
        accepting = false;
        document.querySelectorAll(".cell").forEach(c => c.disabled = true);
        setStatus("Observa…");
        await sleep(350);
        for (const i of sequence) await flash(i);
        accepting = true;
        inputIndex = 0;
        document.querySelectorAll(".cell").forEach(c => c.disabled = false);
        setStatus("Tu turno");
      }

      function nextRound(){
        sequence.push(Math.floor(rnd()*4));
        setLevel(level);
        playSequence();
      }

      function fail(){
        if (finished) return;
        finished = true;
        accepting = false;
        setStatus("Fin · nivel "+level);
        post({type:"finished", score: level});
      }

      function onCell(i){
        if (!accepting || finished) return;
        if (sequence[inputIndex] !== i) { fail(); return; }
        inputIndex += 1;
        if (inputIndex >= sequence.length) {
          level += 1;
          accepting = false;
          setStatus("¡Bien!");
          setTimeout(nextRound, 450);
        }
      }

      function start(){
        if (started || !hostReady) return;
        started = true;
        document.getElementById("hint").style.display = "none";
        post({type:"started"});
        post({type:"score", score:1});
        nextRound();
      }

      window.addEventListener("message", (e)=>{
        const d=e.data; if(!d||typeof d!=="object") return;
        if(d.type==="hostReady"){
          hostReady=true;
          if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
        }
      });

      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
      rnd = mulberry32(seed);
      document.querySelectorAll(".cell").forEach(btn => btn.addEventListener("click", () => onCell(Number(btn.dataset.i))));
      document.getElementById("hint").addEventListener("click", start);
      post({type:"ready", version:"1.0.0"});
    </script>
  </body>
</html>
