<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Speed Tap</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: 72px 16px 20px; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#timer { text-align: center; color: #C8F542; font-weight: 700; font-size: 1.1rem; }
#area { display: grid; place-items: center; }
#circle { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #4a9eff, #2563eb); display: grid; place-items: center; font-size: 2rem; font-weight: 800; cursor: pointer; transition: transform .05s ease; box-shadow: 0 10px 30px rgba(74,158,255,.3); }
#circle:active { transform: scale(0.95); }
#scoreline { text-align: center; font-size: 1.1rem; font-weight: 700; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">10 segundos · toca lo más rápido posible</span></div></div>
<div id="root">
  <div id="timer">10s</div>
  <div id="area"><div id="circle">0</div></div>
  <div id="scoreline">0 toques</div>
</div>
<script>
const GAME_ID = "speed-tap";
const DURATION = 10;
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let count = 0, endsAt = 0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}

function tap(){
  if (!started || finished) return;
  count++;
  document.getElementById("circle").textContent = String(count);
  document.getElementById("scoreline").textContent = count + " toques";
  post({type:"score", score: count});
}

function tick(){
  if (!started || finished) return;
  const left = Math.max(0, Math.ceil((endsAt - performance.now()) / 1000));
  document.getElementById("timer").textContent = left + "s";
  if (left <= 0) {
    finished = true;
    post({type:"finished", score: count});
    return;
  }
  requestAnimationFrame(tick);
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  endsAt = performance.now() + DURATION * 1000;
  post({type:"started"});
  post({type:"score", score:0});
  requestAnimationFrame(tick);
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
document.getElementById("circle").addEventListener("click", tap);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
