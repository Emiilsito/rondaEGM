<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Odd One Out</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: 72px 16px 20px; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#prompt { text-align: center; font-size: 1.2rem; font-weight: 700; }
#grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 340px; width: 100%; margin: 0 auto; align-content: center; }
.cell { aspect-ratio: 1; border-radius: 14px; background: rgba(255,255,255,.1); display: grid; place-items: center; font-size: 1.5rem; cursor: pointer; transition: transform .1s ease, background .15s ease; }
.cell:active { transform: scale(0.92); }
.cell.correct { background: rgba(200,245,66,.3); }
.cell.wrong { background: rgba(255,92,58,.3); }
#scoreline { text-align: center; font-size: 1.1rem; font-weight: 700; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">15 rondas · encuentra el diferente</span></div></div>
<div id="root">
  <div id="prompt">¿Cuál es diferente?</div>
  <div id="grid"></div>
  <div id="scoreline">0 pts</div>
</div>
<script>
const GAME_ID = "odd-one-out";
const ROUNDS = 15;
const ITEMS = ["🍎", "🍊", "🍋", "🍇", "🍓", "🍑", "🍒", "🥝", "🍌", "🍉", "🍍", "🥥"];
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let round = 0, score = 0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}

function makeRound(){
  round++;
  if (round > ROUNDS) return finish();
  const normal = ITEMS[Math.floor(rnd() * ITEMS.length)];
  let odd = ITEMS[Math.floor(rnd() * ITEMS.length)];
  while (odd === normal) odd = ITEMS[Math.floor(rnd() * ITEMS.length)];
  const oddIndex = Math.floor(rnd() * 16);
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (let i = 0; i < 16; i++) {
    const cell = document.createElement("button");
    cell.type = "button";
    cell.textContent = i === oddIndex ? odd : normal;
    cell.addEventListener("click", () => answer(i === oddIndex, cell));
    grid.appendChild(cell);
  }
  document.getElementById("scoreline").textContent = score + " pts";
}

function answer(correct, cell){
  if (!started || finished) return;
  if (correct) {
    score += 1;
    cell.classList.add("correct");
    post({type:"score", score});
  } else {
    cell.classList.add("wrong");
    post({type:"score", score});
  }
  setTimeout(makeRound, 250);
}

function finish(){
  if (finished) return;
  finished = true;
  post({type:"finished", score});
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  post({type:"started"});
  post({type:"score", score:0});
  makeRound();
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
