<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Dodge Game</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; position: relative; overflow: hidden; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#timer { position: absolute; top: 20px; left: 0; right: 0; text-align: center; color: #C8F542; font-weight: 700; font-size: 1.1rem; z-index: 2; }
.player { position: absolute; bottom: 40px; width: 60px; height: 60px; background: #4a9eff; border-radius: 12px; transition: left .05s linear; }
.obstacle { position: absolute; width: 40px; height: 40px; background: #ff5c3a; border-radius: 8px; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">20 segundos · esquiva los obstáculos</span></div></div>
<div id="root">
  <div id="timer">20s</div>
  <div class="player" id="player"></div>
</div>
<script>
const GAME_ID = "dodge-game";
const DURATION = 20;
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let endsAt = 0, playerX = 50, obstacles = [], score = 0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}

function spawn(){
  if (finished) return;
  const obs = document.createElement("div");
  obs.className = "obstacle";
  obs.style.left = (10 + rnd() * 80) + "%";
  obs.style.top = "0";
  document.getElementById("root").appendChild(obs);
  obstacles.push({ el: obs, y: 0, speed: 4 + rnd() * 6 });
  setTimeout(spawn, 300 + rnd() * 500);
}

function movePlayer(e){
  if (!started || finished) return;
  const touch = e.touches ? e.touches[0] : e;
  const rect = document.getElementById("root").getBoundingClientRect();
  playerX = ((touch.clientX - rect.left) / rect.width) * 100;
  document.getElementById("player").style.left = "calc(" + playerX + "% - 30px)";
}

function tick(){
  if (!started || finished) return;
  const left = Math.max(0, Math.ceil((endsAt - performance.now()) / 1000));
  document.getElementById("timer").textContent = left + "s";
  if (left <= 0) {
    finished = true;
    post({type:"finished", score});
    return;
  }
  const player = document.getElementById("player");
  const playerRect = player.getBoundingClientRect();
  const root = document.getElementById("root");
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    obs.y += obs.speed;
    obs.el.style.top = obs.y + "px";
    const obsRect = obs.el.getBoundingClientRect();
    if (obsRect.bottom > playerRect.top && obsRect.top < playerRect.bottom &&
        obsRect.left < playerRect.right && obsRect.right > playerRect.left) {
      finished = true;
      post({type:"finished", score});
      return;
    }
    if (obs.y > window.innerHeight) {
      obs.el.remove();
      obstacles.splice(i, 1);
      score += 1;
      post({type:"score", score});
    }
  }
  requestAnimationFrame(tick);
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  endsAt = performance.now() + DURATION * 1000;
  post({type:"started"});
  post({type:"score", score:0});
  spawn();
  requestAnimationFrame(tick);
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
document.getElementById("root").addEventListener("touchmove", movePlayer);
document.getElementById("root").addEventListener("mousemove", movePlayer);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
