<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Tap Rush</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; }
      #hint {
        position: absolute; inset: 0; display: grid; place-items: center;
        background: rgba(7,16,24,.72); color: #fff; z-index: 5; cursor: pointer;
        backdrop-filter: blur(4px);
      }
      #hint strong { display: block; font-size: 1.4rem; margin-bottom: .35rem; }
      #hint span { opacity: .7; font-size: .9rem; }
      .target {
        position: absolute; width: 64px; height: 64px; border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ff8f73, #ff5c3a 60%, #c73a22);
        box-shadow: 0 0 0 4px rgba(255,92,58,.25), 0 10px 24px rgba(0,0,0,.35);
        transform: translate(-50%, -50%) scale(0.85);
        transition: transform .08s ease;
        touch-action: manipulation;
      }
      .target:active { transform: translate(-50%, -50%) scale(0.95); }
      #hud {
        position: absolute; left: 16px; right: 16px; bottom: 18px;
        display: flex; justify-content: space-between; color: rgba(255,255,255,.75); font-size: .85rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="hint"><div style="text-align:center"><strong>Toca para empezar</strong><span>12 objetivos · lo más rápido posible</span></div></div>
      <div id="hud"><span id="left">12 restantes</span><span id="time">0.00s</span></div>
    </div>
    <script>
      const GAME_ID = "tap-rush";
      const TOTAL = 12;
      let seed = 1;
      let rnd = Math.random;
      let started = false;
      let finished = false;
      let remaining = TOTAL;
      let startAt = 0;
      let hostReady = false;
      let assetReady = false;

      function mulberry32(a) {
        return function() {
          a |= 0; a = a + 0x6D2B79F5 | 0;
          let t = Math.imul(a ^ a >>> 15, 1 | a);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      function post(msg) {
        parent.postMessage({ ...msg, gameId: GAME_ID }, "*");
      }

      function parseHash() {
        const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
        const s = Number(hash.get("seed"));
        if (Number.isFinite(s)) seed = s >>> 0;
      }

      function spawn() {
        document.querySelectorAll(".target").forEach((n) => n.remove());
        if (remaining <= 0 || finished) return;
        const el = document.createElement("button");
        el.className = "target";
        el.type = "button";
        el.setAttribute("aria-label", "objetivo");
        const x = 12 + rnd() * 76;
        const y = 18 + rnd() * 62;
        el.style.left = x + "%";
        el.style.top = y + "%";
        el.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          if (!started || finished) return;
          remaining -= 1;
          document.getElementById("left").textContent = remaining + " restantes";
          const elapsed = (performance.now() - startAt) / 1000;
          post({ type: "score", score: -elapsed });
          if (remaining <= 0) {
            finish(elapsed);
          } else {
            spawn();
          }
        });
        document.getElementById("root").appendChild(el);
      }

      function tick() {
        if (!started || finished) return;
        const elapsed = (performance.now() - startAt) / 1000;
        document.getElementById("time").textContent = elapsed.toFixed(2) + "s";
        requestAnimationFrame(tick);
      }

      function finish(elapsed) {
        if (finished) return;
        finished = true;
        document.querySelectorAll(".target").forEach((n) => n.remove());
        post({ type: "finished", score: -elapsed });
      }

      function start(fromOverlay) {
        if (started || finished || !hostReady) return;
        started = true;
        if (fromOverlay) document.getElementById("hint").style.display = "none";
        startAt = performance.now();
        post({ type: "started" });
        post({ type: "score", score: 0 });
        spawn();
        requestAnimationFrame(tick);
      }

      function maybeReady() {
        if (!assetReady || !document.body) return;
        post({ type: "ready", version: "1.0.0" });
      }

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || typeof data !== "object") return;
        if (data.type === "hostReady") {
          hostReady = true;
          if (typeof data.seed === "number") {
            seed = data.seed >>> 0;
            rnd = mulberry32(seed);
          }
        }
      });

      parseHash();
      rnd = mulberry32(seed);
      assetReady = true;
      document.getElementById("hint").addEventListener("click", () => start(true));
      maybeReady();
    </script>
  </body>
</html>
