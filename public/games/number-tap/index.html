<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Number Tap</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: 72px 16px 20px; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#timer { text-align: center; color: #C8F542; font-weight: 700; font-size: 1.1rem; }
#grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 340px; width: 100%; margin: 0 auto; align-content: center; }
.cell { aspect-ratio: 1; border-radius: 12px; background: rgba(255,255,255,.1); display: grid; place-items: center; font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: transform .1s ease, background .15s ease; }
.cell:active { transform: scale(0.92); }
.cell.done { background: rgba(200,245,66,.3); opacity: .4; }
.cell.current { background: #C8F542; color: #071018; }
#scoreline { text-align: center; font-size: 1.1rem; font-weight: 700; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">20 segundos · toca los números en orden</span></div></div>
<div id="root">
  <div id="timer">20s</div>
  <div id="grid"></div>
  <div id="scoreline">0</div>
</div>
<script>
const GAME_ID = "number-tap";
const DURATION = 20;
const TOTAL = 25;
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let score = 0, endsAt = 0, nextNumber = 1;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function makeGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const numbers = shuffle(Array.from({length: TOTAL}, (_, i) => i + 1));
  for (const n of numbers) {
    const cell = document.createElement("button");
    cell.type = "button";
    cell.textContent = String(n);
    cell.dataset.n = String(n);
    if (n < nextNumber) cell.classList.add("done");
    if (n === nextNumber) cell.classList.add("current");
    cell.addEventListener("click", () => tap(n, cell));
    grid.appendChild(cell);
  }
}

function tap(n, cell){
  if (!started || finished) return;
  if (n === nextNumber) {
    score = n;
    nextNumber++;
    cell.classList.add("done");
    cell.classList.remove("current");
    document.getElementById("scoreline").textContent = String(score);
    post({type:"score", score});
    const next = document.querySelector('[data-n="' + nextNumber + '"]');
    if (next) next.classList.add("current");
    if (nextNumber > TOTAL) finish();
  }
}

function tick(){
  if (!started || finished) return;
  const left = Math.max(0, Math.ceil((endsAt - performance.now()) / 1000));
  document.getElementById("timer").textContent = left + "s";
  if (left <= 0) {
    finished = true;
    post({type:"finished", score});
    return;
  }
  requestAnimationFrame(tick);
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  endsAt = performance.now() + DURATION * 1000;
  post({type:"started"});
  post({type:"score", score:0});
  makeGrid();
  requestAnimationFrame(tick);
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
