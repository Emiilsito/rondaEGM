<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Rhythm Game</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1524; font-family: system-ui, sans-serif; color: #fff; }
#root { height: 100%; position: relative; overflow: hidden; }
#hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,16,24,.72); z-index: 5; cursor: pointer; backdrop-filter: blur(4px); text-align: center; }
#scoreline { position: absolute; bottom: 40px; left: 0; right: 0; text-align: center; font-size: 1.2rem; font-weight: 700; z-index: 2; }
.beat { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: #ff5c3a; top: -60px; }
.beat.hit { background: #C8F542; }
</style>
</head>
<body>
<div id="hint"><div><strong style="font-size:1.4rem;display:block;margin-bottom:.35rem">Toca para empezar</strong><span style="opacity:.7">Toca los círculos cuando lleguen abajo</span></div></div>
<div id="root">
  <div id="scoreline">0 pts</div>
</div>
<script>
const GAME_ID = "rhythm-game";
const DURATION = 20;
let seed = 1, rnd = Math.random, hostReady = false, started = false, finished = false;
let score = 0, endsAt = 0, beats = [];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function post(msg){parent.postMessage({...msg, gameId: GAME_ID}, "*")}

function spawn(){
  if (finished) return;
  const beat = document.createElement("div");
  beat.className = "beat";
  beat.style.left = (20 + rnd() * 60) + "%";
  document.getElementById("root").appendChild(beat);
  beats.push({ el: beat, y: -60, speed: 3 + rnd() * 3 });
  setTimeout(spawn, 500 + rnd() * 800);
}

function tapBeat(beat){
  if (!started || finished) return;
  const rect = beat.el.getBoundingClientRect();
  const root = document.getElementById("root").getBoundingClientRect();
  if (rect.top > root.height - 100 && rect.top < root.height) {
    beat.el.remove();
    beats.splice(beats.indexOf(beat), 1);
    score += 1;
    document.getElementById("scoreline").textContent = score + " pts";
    post({type:"score", score});
  }
}

function tick(){
  if (!started || finished) return;
  const left = Math.max(0, Math.ceil((endsAt - performance.now()) / 1000));
  if (left <= 0) {
    finished = true;
    post({type:"finished", score});
    return;
  }
  const root = document.getElementById("root");
  for (let i = beats.length - 1; i >= 0; i--) {
    const beat = beats[i];
    beat.y += beat.speed;
    beat.el.style.top = beat.y + "px";
    if (beat.y > window.innerHeight) {
      beat.el.remove();
      beats.splice(i, 1);
    }
  }
  requestAnimationFrame(tick);
}

function start(){
  if (started || !hostReady) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  endsAt = performance.now() + DURATION * 1000;
  post({type:"started"});
  post({type:"score", score:0});
  spawn();
  requestAnimationFrame(tick);
}

window.addEventListener("message", (e)=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  if(d.type==="hostReady"){
    hostReady=true;
    if(typeof d.seed==="number"){ seed=d.seed>>>0; rnd=mulberry32(seed); }
  }
});

const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const s = Number(hash.get("seed")); if (Number.isFinite(s)) seed = s>>>0;
rnd = mulberry32(seed);
document.getElementById("hint").addEventListener("click", start);
post({type:"ready", version:"1.0.0"});
</script>
</body>
</html>
